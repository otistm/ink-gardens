<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" style="fill:var(--paper)"/><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--ink);stroke-width:2.6"/></pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" style="fill:var(--paper)"/><circle cx="3" cy="3" r="1.15" style="fill:var(--ink)"/></pattern>
  <pattern id="stripes" width="6" height="5" patternUnits="userSpaceOnUse"><rect width="6" height="5" style="fill:var(--paper)"/><line x1="0" y1="2.5" x2="6" y2="2.5" style="stroke:var(--ink);stroke-width:1.5"/></pattern>
</defs></svg>

<div id="app">
  <header class="top">
    <button class="icon" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 14 14"><rect x="2" y="1" width="3.5" height="12" rx="1" style="fill:var(--ink)"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" style="fill:var(--ink)"/></svg></button>
    <div class="meter" aria-label="Share of the street">
      <div class="mlab"><span>Ink Gardens</span><span>Everbloom</span></div>
      <div class="mbar"><i id="mfill"></i></div>
    </div>
    <div class="till"><small>Till</small><b id="till">$0</b></div>
  </header>
  <section class="rail" id="rail" aria-label="Customers"></section>
  <section class="bucket" id="bucket" aria-label="Bucket of cut flowers"></section>
  <section class="garden" id="garden" aria-label="The garden"></section>
  <p class="hint" id="hint" role="status"></p>
  <nav class="tray" id="tray" aria-label="Seed packets"></nav>
</div>
<div id="fx"></div>
<div id="toast" role="status"></div>
<div class="screen" id="screen"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/online.js"></script>
<script src="js/audio.js"></script>
<script src="js/draw.js"></script>
<script src="js/garden.js"></script>
<script src="js/shop.js"></script>
<script src="js/screens.js"></script>
<script>start();</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
